version: '2.1'

services:
  api:
    container_name: go-agro-sentinel-api
    build: .
    command: api
    restart: always
    ports:
      - "8088:6000"
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - go-agro-sentinel-worker-tmp:/tmp
    environment:
      CONFIG_PATH: /etc/agro-sentinel/config.yaml
      MYSQL_HOST: go-agro-sentinel-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root

      AWS_ENDPOINT_URL: #http://go-agro-sentinel-localstack:4566
      AWS_REGION: ${S3_REGION:-} #us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-} #test
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-} # test
# Rewrites presigned S3 URLs so browsers can reach LocalStack via the host.
      # Change to your server IP/domain in staging/prod (leave empty for real AWS).
      S3_PUBLIC_ENDPOINT: #http://localhost:4566
      GOMEMLIMIT: 110MiB
      # IA Bedrock — valores en .env (nunca en este archivo)
      IA_AWS_ACCESS_KEY_ID: ${IA_AWS_ACCESS_KEY_ID:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      IA_BEDROCK_MODEL_ID: ${IA_BEDROCK_MODEL_ID:-}
      IA_BEDROCK_REGION: ${IA_BEDROCK_REGION:-us-east-1}
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    container_name: go-agro-sentinel-worker
    build: .
    command: worker --auto
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - go-agro-sentinel-worker-tmp:/tmp
    environment:
      CONFIG_PATH: /etc/agro-sentinel/config.yaml
      MYSQL_HOST: go-agro-sentinel-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      AWS_ENDPOINT_URL: #http://go-agro-sentinel-localstack:4566
      AWS_REGION: ${S3_REGION:-} #  us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-} #  test
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-} #  test
      SQS_QUEUE_URL: http://go-agro-sentinel-localstack:4566/000000000000/agro-sentinel-jobs
      GOMEMLIMIT: 460MiB
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy

  sync:
    container_name: go-agro-sentinel-sync
    build: .
    command: sync
    restart: always
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - go-agro-sentinel-worker-tmp:/tmp
    environment:
      CONFIG_PATH: /etc/agro-sentinel/config.yaml
      MYSQL_HOST: go-agro-sentinel-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      # S3/SQS usan LocalStack (datos locales)
      AWS_ENDPOINT_URL: #http://go-agro-sentinel-localstack:4566
      AWS_REGION: ${S3_REGION:-} #us-east-1 us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-} #test test
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-} # test test
      GOMEMLIMIT: 110MiB
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy

  mysql:
    container_name: go-agro-sentinel-mysql
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agro
    ports:
      - "3309:3306"
    volumes:
      - go-agro-sentinel-mysql-data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  localstack:
    container_name: go-agro-sentinel-localstack
    image: localstack/localstack:3.8
    restart: always
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,dynamodb
    volumes:
      - go-agro-sentinel-localstack-data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  go-agro-sentinel-mysql-data:
  go-agro-sentinel-localstack-data:
  go-agro-sentinel-worker-tmp:
