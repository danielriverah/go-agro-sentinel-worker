version: '2.1'

services:
  api:
    container_name: go-agro-sentinel-api
    build: .
    command: api
    restart: always
    ports:
      - "8088:6000"
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - go-agro-sentinel-worker-tmp:/tmp
    environment:
      CONFIG_PATH: /etc/agro-sentinel/config.yaml
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_DB: ${MYSQL_DB:-}

      # AWS real por defecto. Para consumir un mock externo, define
      # AWS_ENDPOINT_URL/DYNAMODB_ENDPOINT en .env apuntando a ese stack externo.
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DYNAMODB_TABLE_PRODUCCIONES: ${DYNAMODB_TABLE_PRODUCCIONES:-}
      DYNAMODB_TABLE_ESCENAS: ${DYNAMODB_TABLE_ESCENAS:-}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      DYNAMODB_REGION: ${DYNAMODB_REGION:-}
      DYNAMODB_ACCESS_KEY_ID: ${DYNAMODB_ACCESS_KEY_ID:-}
      DYNAMODB_SECRET_ACCESS_KEY: ${DYNAMODB_SECRET_ACCESS_KEY:-}
      # Auth configuration
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-8}
      AUTH_DELETE_ALLOWED_USER_IDS: ${AUTH_DELETE_ALLOWED_USER_IDS:-}
      # Logging configuration
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
      LOGGING_FORMAT: ${LOGGING_FORMAT:-json}
      GOMEMLIMIT: 110MiB
      # IA Bedrock — valores en .env (nunca en este archivo)
      IA_AWS_ACCESS_KEY_ID: ${IA_AWS_ACCESS_KEY_ID:-}
      IA_AWS_SECRET_ACCESS_KEY: ${IA_AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      IA_BEDROCK_MODEL_ID: ${IA_BEDROCK_MODEL_ID:-}
      IA_BEDROCK_REGION: ${IA_BEDROCK_REGION:-us-east-1}

  worker:
    container_name: go-agro-sentinel-worker
    build: .
    command: worker --auto
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - go-agro-sentinel-worker-tmp:/tmp
    environment:
      CONFIG_PATH: /etc/agro-sentinel/config.yaml
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_DB: ${MYSQL_DB:-}

      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DYNAMODB_TABLE_PRODUCCIONES: ${DYNAMODB_TABLE_PRODUCCIONES:-}
      DYNAMODB_TABLE_ESCENAS: ${DYNAMODB_TABLE_ESCENAS:-}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      DYNAMODB_REGION: ${DYNAMODB_REGION:-}
      DYNAMODB_ACCESS_KEY_ID: ${DYNAMODB_ACCESS_KEY_ID:-}
      DYNAMODB_SECRET_ACCESS_KEY: ${DYNAMODB_SECRET_ACCESS_KEY:-}
      # Worker scheduler configuration
      WORKER_SCHEDULE: ${WORKER_SCHEDULE:-}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-America/Mexico_City}
      # Logging configuration
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
      LOGGING_FORMAT: ${LOGGING_FORMAT:-json}
      GOMEMLIMIT: 460MiB

  sync:
    container_name: go-agro-sentinel-sync
    build: .
    command: sync
    restart: always
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - go-agro-sentinel-worker-tmp:/tmp
    environment:
      CONFIG_PATH: /etc/agro-sentinel/config.yaml
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_DB: ${MYSQL_DB:-}

      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DYNAMODB_TABLE_PRODUCCIONES: ${DYNAMODB_TABLE_PRODUCCIONES:-}
      DYNAMODB_TABLE_ESCENAS: ${DYNAMODB_TABLE_ESCENAS:-}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      DYNAMODB_REGION: ${DYNAMODB_REGION:-}
      DYNAMODB_ACCESS_KEY_ID: ${DYNAMODB_ACCESS_KEY_ID:-}
      DYNAMODB_SECRET_ACCESS_KEY: ${DYNAMODB_SECRET_ACCESS_KEY:-}
      # Sync scheduler configuration
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-America/Mexico_City}
      # Logging configuration
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
      LOGGING_FORMAT: ${LOGGING_FORMAT:-json}
      GOMEMLIMIT: 110MiB
volumes:
  go-agro-sentinel-worker-tmp:
