app:
  name: agro-sentinel-worker
  environment: development

server:
  host: 0.0.0.0
  port: 6000

sync:
  interval_minutes: 15
  dias_margen_monitoreo: 30

processing:
  temp_dir: /tmp/agro-sentinel
  target_resolution: 10
  resampling_method: bilinear
  workers: 1
  downloads_concurrency: 2

sentinel:
  cloud_cover_scene_max: 70
  cloud_cover_production_max: 23

aws:
  region: us-west-2

s3:
  bucket: agro-sentinel-bucket
  prefix: sentinel/producciones
  region: ""            # us-west-2 — dejar vacío para heredar de aws.region

sqs:
  queue_url: ""

dynamodb:
  table_producciones: monitoring_producciones
  table_escenas: monitoring_escenas
  region: ""            # us-east-1 — dejar vacío para heredar de aws.region
  endpoint: ""          # dejar vacío para AWS real; http://localstack:4566 para local
  access_key_id: ""     # credenciales explícitas para AWS real
  secret_access_key: "" # si vacío usa el default credential chain (env vars / instance profile)

mysql:
  host: localhost
  port: 3306
  database: agro
  user: ""
  password: ""

ia:
  # Análisis IA vía AWS Bedrock — se dispara manualmente desde POST /api/v1/escenas/{id}/analizar
  # Dejar vacío en local; poner credenciales reales en producción (o usar variables de entorno).
  bedrock:
    model_id: ""                # ej: global.anthropic.claude-haiku-4-5-20251001-v1:0
    region: "us-east-1"
    api_key: ""                 # AWS Secret Access Key para Bedrock (BEDROCK_API_KEY)
    access_key_id: ""           # AWS Access Key ID para Bedrock (IA_AWS_ACCESS_KEY_ID)
    secret_access_key: ""       # alternativa a api_key (IA_AWS_SECRET_ACCESS_KEY)
    timeout_seconds: 60

gdal:
  timeout_seconds: 300

logging:
  level: info
  format: json
